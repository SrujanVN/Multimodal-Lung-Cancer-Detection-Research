services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLASK_APP: app.py
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      PORT: 5000
      MPLBACKEND: Agg
    volumes:
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
      - ./static/reports:/app/static/reports
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=8)); assert d.get('status') == 'ok' and len(d.get('models', {}).get('ct', [])) == 4 and len(d.get('models', {}).get('xray', [])) == 4 and d.get('clinical_model_available')"
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
