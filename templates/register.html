<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LungVision AI - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        background: linear-gradient(to bottom right, #0a1e3d, #1e3a8a, #0d947a, #2d3748);
        color: #f3f4f6;
        font-family: 'Inter', sans-serif;
        height: 100vh; /* Maintains full height but allows overflow */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .star {
        position: absolute;
        background: rgba(255, 215, 0, 0.8);
        border-radius: 50%;
        animation: twinkle 3s infinite alternate;
      }
      @keyframes twinkle {
        from { opacity: 0.4; }
        to { opacity: 0.9; }
      }
      .register-container {
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(18px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.1);
        padding: 3.5rem;
        width: 100%;
        max-width: 480px;
        position: relative;
        border-radius: 1.75rem;
        animation: float 5s infinite ease-in-out;
        z-index: 1;
        overflow-y: auto; /* Vertical scrolling only when needed */
        overflow-x: hidden; /* Prevent horizontal scrolling */
        max-height: 90vh; /* Limits height to allow scrolling only when content exceeds */
        box-sizing: border-box; /* Ensure padding doesn't affect height */
        scroll-behavior: smooth; /* Smooth scrolling */
      }
      .register-container::-webkit-scrollbar {
        width: 8px; /* Width of the scrollbar */
      }
      .register-container::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3); /* Matches dark gradient */
        border-radius: 4px;
      }
      .register-container::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #0d947a, #14b8a6); /* Teal from gradient */
        border-radius: 4px;
      }
      .register-container::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #14b8a6, #6ee7b7); /* Lighter teal on hover */
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      .register-container::before {
        content: '';
        position: absolute;
        top: -60%;
        left: -60%;
        width: 220%;
        height: 220%;
        background: radial-gradient(circle, rgba(13, 148, 136, 0.25) 0%, rgba(255, 215, 0, 0.05) 70%, transparent 100%);
        animation: rotate 20s linear infinite;
        z-index: -1;
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 2.75rem;
        font-weight: 700;
        color: #14b8a6;
        text-shadow: 0 0 15px rgba(20, 184, 166, 0.8), 0 0 5px rgba(255, 215, 0, 0.3);
        margin-bottom: 2rem;
        text-align: center;
        letter-spacing: 1px;
      }
      .form-group {
        margin-bottom: 2rem;
      }
      .form-group label {
        display: block;
        font-size: 1rem;
        color: #d1d5db;
        margin-bottom: 0.75rem;
        font-weight: 500;
      }
      .form-group input {
        width: 100%;
        padding: 1rem 1.25rem;
        border-radius: 0.625rem;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5));
        color: #fff;
        font-size: 1.1rem;
        transition: all 0.4s ease;
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.4);
        box-sizing: border-box;
      }
      .form-group input:focus {
        outline: none;
        box-shadow: 0 0 20px rgba(20, 184, 166, 0.7), inset 0 3px 6px rgba(0, 0, 0, 0.4);
        transform: scale(1.03);
      }
      .form-group select {
        width: 100%;
        padding: 1rem 1.25rem;
        border-radius: 0.625rem;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5));
        color: #fff;
        font-size: 1.1rem;
        transition: all 0.4s ease;
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.4);
        -webkit-appearance: none; /* Removes default styling */
        -moz-appearance: none;
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #d1d5db 50%), linear-gradient(135deg, #d1d5db 50%, transparent 50%);
        background-position: calc(100% - 20px) center, calc(100% - 15px) center;
        background-size: 10px 10px, 10px 10px;
        background-repeat: no-repeat;
        box-sizing: border-box;
      }
      .form-group select:focus {
        outline: none;
        box-shadow: 0 0 20px rgba(20, 184, 166, 0.7), inset 0 3px 6px rgba(0, 0, 0, 0.4);
        transform: scale(1.03);
      }
      .form-group select option {
        background: #0a1e3d; /* Matches body background for visibility */
        color: #f3f4f6; /* White text for contrast */
        padding: 0.5rem;
      }
      .form-group select option:hover {
        background: #0d947a; /* Teal hover for better visibility */
        color: #fff;
      }
      #passwordStrength {
        width: 100%;
        height: 6px; /* Slimmer for a modern look */
        background: rgba(255, 255, 255, 0.1); /* Subtle background to match theme */
        border-radius: 3px;
        margin-top: 0.5rem;
        box-sizing: border-box;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      #passwordStrength::after {
        content: '';
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(to right, #0d947a, #14b8a6, #6ee7b7); /* Teal gradient matching page */
        transition: width 0.3s ease, background 0.3s ease;
        border-radius: 3px;
        box-shadow: 0 1px 3px rgba(255, 215, 0, 0.3); /* Subtle gold glow */
      }
      .strength-0 #passwordStrength::after { width: 0%; background: #ef4444; } /* Red for weak */
      .strength-1 #passwordStrength::after { width: 33%; background: #f59e0b; } /* Orange for medium */
      .strength-2 #passwordStrength::after { width: 66%; background: #10b981; } /* Green for strong */
      .strength-3 #passwordStrength::after { width: 100%; background: #6ee7b7; } /* Full teal for very strong */
      #passwordMessage {
        display: none;
        margin-top: 0.25rem;
        color: #f87171;
        font-size: 0.9rem;
        font-weight: 500;
        text-align: left;
      }
      button {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(90deg, #0d9488, #14b8a6, #6ee7b7);
        border-radius: 0.625rem;
        color: #fff;
        font-weight: 600;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.5s ease;
        box-shadow: 0 8px 20px rgba(13, 148, 136, 0.6);
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
      }
      button::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 215, 0, 0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.7s ease, height 0.7s ease;
      }
      button:hover {
        transform: scale(1.002);
        box-shadow: 0 8px 20px rgba(13, 148, 136, 0.62);
      }
      button:hover::after {
        width: 75%;
        height: 75%;
      }
      .nav-buttons {
        position: absolute;
        top: 1rem;
        right: 1rem; /* Moved to top right */
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        z-index: 2;
      }
      .return-btn, .return-home-btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        color: #fff;
        font-weight: 500;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.4s ease;
        box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
      }
      .return-btn {
        background: linear-gradient(to bottom, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
      }
      .return-home-btn {
        background: linear-gradient(to bottom, rgba(13, 148, 136, 0.2), rgba(20, 184, 166, 0.1));
      }
      .return-btn:hover, .return-home-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(255, 215, 0, 0.4);
      }
      .return-btn .loading, .return-home-btn .loading {
        display: none;
        margin-left: 0.5rem;
      }
      .return-btn.loading .loading, .return-home-btn.loading .loading {
        display: inline-block;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      #message {
        text-align: center;
        margin-top: 1rem;
        color: #f87171;
        font-size: 1rem;
        animation: pulse 1.5s infinite alternate;
      }
      @keyframes pulse {
        from { opacity: 0.8; transform: scale(1); }
        to { opacity: 1; transform: scale(1.05); }
      }
      .canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      .fade-slide-out {
        animation: fadeSlideOut 0.6s ease-out forwards;
      }
      @keyframes fadeSlideOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-20px); }
      }
      .fade-slide-in {
        animation: fadeSlideIn 0.6s ease-out forwards;
      }
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .consent-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #d1d5db;
        font-size: 0.9rem;
      }
      .consent-group a {
        color: #2dd4bf;
        text-decoration: underline;
      }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
  <div class="canvas-container" id="canvas-container"></div>
  <div class="nav-buttons">
    <a href="#" id="return-login-btn" class="return-btn">
      Return to Login Page
      <i class="fas fa-spinner loading"></i>
    </a>
    <a href="#" id="return-home-btn" class="return-home-btn">
      Return to Homepage
      <i class="fas fa-spinner loading"></i>
    </a>
  </div>
  <div class="register-container fade-slide-in" id="register-container">
    <h2>LungVision AI Registration</h2>
    <form id="registerForm" action="/register" method="POST">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" maxlength="60" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password (min 8 chars, 1 special)" required>
        <div id="passwordStrength"></div>
        <div id="passwordMessage"></div>
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" required>
          <option value="">Select Role</option>
          <option value="Patient">Patient</option>
          <option value="Clinician">Clinician</option>
          <option value="Researcher">Researcher</option>
        </select>
      </div>
      <div class="form-group consent-group">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I agree to the <a href="/terms">Terms of Use</a> and <a href="/privacy">Privacy Policy</a>. This tool is for informational purposes only and does not replace professional medical advice.</label>
      </div>
      <p id="message"></p>
      <button type="submit">Register</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/validate.js') }}"></script>
  <script>
    // Create stars
    function createStars(count) {
      const container = document.getElementById('canvas-container');
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = `${Math.random() * 4 + 1}px`;
        star.style.height = star.style.width;
        star.style.left = `${Math.random() * 100}vw`;
        star.style.top = `${Math.random() * 100}vh`;
        star.style.animationDuration = `${Math.random() * 3 + 2}s`;
        container.appendChild(star);
      }
    }
    createStars(60);

    // Password strength check
    const passwordInput = document.getElementById('password');
    const passwordStrength = document.getElementById('passwordStrength');
    const passwordMessage = document.getElementById('passwordMessage');
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;
      passwordStrength.className = `strength-${strength - 1}`;
      if (strength < 4) {
        passwordMessage.textContent = 'Password must be at least 8 chars, with 1 uppercase, 1 number, 1 special char.';
        passwordMessage.style.display = 'block';
      } else {
        passwordMessage.style.display = 'none';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = document.getElementById('role').value;
      const consent = document.getElementById('consent').checked;
      const message = document.getElementById('message');

      message.textContent = '';

      if (!fullName || !email || !password || !role || !consent) {
        message.textContent = 'Please fill all fields and agree to terms.';
        return;
      }

      // Additional password validation
      if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        message.textContent = 'Password does not meet requirements.';
        return;
      }

      fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, email, password, role })
      })
      .then(response => {
        if (!response.ok) throw new Error('Server error');
        return response.json();
      })
      .then(data => {
        if (data.success) {
          window.location.href = '/login';
        } else {
          message.textContent = data.error || 'Registration failed. Please try again.';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        message.textContent = 'An unexpected error occurred. Please try again.';
      });
    });

    const returnLoginBtn = document.getElementById('return-login-btn');
    returnLoginBtn.addEventListener('click', function(e) {
      e.preventDefault();
      this.classList.add('loading');
      document.getElementById('register-container').classList.add('fade-slide-out');
      setTimeout(() => {
        window.location.href = '/login';
      }, 600);
    });

    const returnHomeBtn = document.getElementById('return-home-btn');
    returnHomeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      this.classList.add('loading');
      document.getElementById('register-container').classList.add('fade-slide-out');
      setTimeout(() => {
        window.location.href = '/';
      }, 600);
    });
  </script>
</body>
</html>
